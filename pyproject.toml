[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-licitaciones-caba"
version = "2.3.0"
description = "Boletín Oficial CABA -> Postgres -> señales de contratación pública"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "pypdfium2>=5",
]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]
app = ["streamlit>=1.50", "pandas>=2"]
llm = ["anthropic>=2.12"]   # llm-enviar / llm-recolectar (no hace falta para --dry-run)
notebooks = ["pandas>=2", "matplotlib>=3.8", "jupyterlab>=4", "nbstripout>=0.7"]

[project.scripts]
monitor-licitaciones = "monitor_licitaciones.cli:main"

[tool.setuptools]
packages = ["monitor_licitaciones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
